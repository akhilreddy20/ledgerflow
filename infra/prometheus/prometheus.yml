global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ledgerflow
    metrics_path: /metrics
    static_configs:
      - targets: ["ledger:3001"]
        labels: { service: ledger }
      - targets: ["payments:3002"]
        labels: { service: payments }
      - targets: ["notifications:3003"]
        labels: { service: notifications }
      - targets: ["psp-simulator:3004"]
        labels: { service: psp-simulator }
      # When running the services on your host with npm instead of in Docker:
      - targets: ["host.docker.internal:3001", "host.docker.internal:3002", "host.docker.internal:3003", "host.docker.internal:3004"]
        labels: { service: host }
