# payments: Deployment + Service + PodDisruptionBudget
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels: { app: payments, part-of: ledgerflow }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payments }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: payments, part-of: ledgerflow }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: payments
          image: ledgerflow/payments:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3002 }
          envFrom:
            - configMapRef: { name: ledgerflow-config }
          env:
            - { name: PORT, value: "3002" }
            - { name: OTEL_SERVICE_NAME, value: payments-service }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ledgerflow-secrets, key: payments-database-url } }
            - { name: PSP_URL, value: "http://psp-simulator:3004" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  labels: { app: payments }
spec:
  selector: { app: payments }
  ports:
    - { name: http, port: 3002, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: payments }
