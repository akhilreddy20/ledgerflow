# Autoscaling with KEDA (https://keda.sh) - install it first:
#   helm repo add kedacore https://kedacore.github.io/charts && helm install keda kedacore/keda -n keda --create-namespace
#
# Why lag and not just CPU? A consumer waiting on Postgres or the PSP can be far behind while its CPU is idle.
# Consumer lag (messages not yet processed) is the real signal of "we need more workers".
# maxReplicaCount <= partition count: Kafka gives each partition to at most one consumer in a group,
# so replicas beyond the partition count would sit idle.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ledger
spec:
  scaleTargetRef: { name: ledger }
  minReplicaCount: 2
  maxReplicaCount: 6
  cooldownPeriod: 120
  pollingInterval: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: ledger-service
        topic: ledger.commands
        lagThreshold: "100"
        offsetResetPolicy: earliest
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payments
spec:
  scaleTargetRef: { name: payments }
  minReplicaCount: 2
  maxReplicaCount: 6
  cooldownPeriod: 120
  pollingInterval: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: payments-saga
        topic: ledger.events
        lagThreshold: "100"
        offsetResetPolicy: earliest
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notifications
spec:
  scaleTargetRef: { name: notifications }
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 120
  pollingInterval: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: notifications-service
        topic: payments.events
        lagThreshold: "100"
        offsetResetPolicy: earliest
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
